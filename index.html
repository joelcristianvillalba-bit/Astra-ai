<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Astra Live — Pruebas</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; max-width: 800px; margin: auto; }
    button { margin: 6px 0; padding: 8px 12px; }
    #log { white-space: pre-wrap; background:#f6f8fa; padding:12px; border-radius:6px; margin-top:12px; min-height:120px;}
    label { display:block; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Astra Live — Página de pruebas</h1>

  <label>Backend:
    <input id="backend" type="text" value="BACKEND_URL" style="width:100%" />
  </label>

  <div>
    <button id="register-sw">Registrar Service Worker</button>
    <button id="request-notif">Pedir permiso de notifs</button>
    <button id="subscribe">Suscribirse (Push)</button>
    <button id="simulate">Simular evento (POST /simulate)</button>
    <button id="connect-ws">Conectar WebSocket</button>
  </div>

  <h3>Estado / Logs</h3>
  <div id="log">Logs aparecerán aquí...</div>

  <script>
    const logEl = document.getElementById('log');
    const backendInput = document.getElementById('backend');

    function log(...txt) {
      const t = txt.map(x => typeof x === 'object' ? JSON.stringify(x,null,2) : String(x)).join(' ');
      logEl.textContent = new Date().toLocaleTimeString() + ' — ' + t + '\n' + logEl.textContent;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function registerSW() {
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          log('Service worker registrado:', reg.scope);
        } catch (err) {
          log('Error registrando SW:', err);
        }
      } else {
        log('Service workers no soportado en este navegador.');
      }
    }

    async function requestNotificationPermission() {
      const p = await Notification.requestPermission();
      log('Permiso notifs:', p);
    }

    async function subscribePush() {
      const backend = backendInput.value.trim();
      if (!backend || backend === 'BACKEND_URL') return log('Pon la URL del backend en el campo Backend.');
      try {
        const res = await fetch(new URL('/vapidPublicKey', backend).toString());
        if (!res.ok) throw new Error('No se pudo obtener VAPID key: ' + res.status);
        const data = await res.json();
        const vapidPublicKey = data.key || data.publicKey || data;
        log('Clave VAPID obtenida:', (vapidPublicKey||'').slice(0,20) + '...');

        if (!navigator.serviceWorker.controller) {
          await registerSW();
        }
        const reg = await navigator.serviceWorker.ready;

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });

        log('Subscription object:', sub);
        const resp = await fetch(new URL('/subscribe', backend).toString(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });
        log('/subscribe status:', resp.status);
      } catch (err) {
        log('Error al subscribir:', err);
      }
    }

    async function simulateEvent() {
      const backend = backendInput.value.trim();
      if (!backend || backend === 'BACKEND_URL') return log('Pon la URL del backend en el campo Backend.');
      try {
        const resp = await fetch(new URL('/simulate', backend).toString(), { method: 'POST' });
        const txt = await resp.text();
        log('/simulate ->', resp.status, txt);
      } catch (err) {
        log('Error simulate:', err);
      }
    }

    let ws;
    function connectWS() {
      const backend = backendInput.value.trim();
      if (!backend || backend === 'BACKEND_URL') return log('Pon la URL del backend en el campo Backend.');
      try {
        const wsUrl = backend.replace(/^http/, 'ws') + '/ws';
        ws = new WebSocket(wsUrl);
        ws.onopen = () => log('WS conectado a', wsUrl);
        ws.onmessage = (e) => log('WS mensaje:', e.data);
        ws.onclose = () => log('WS cerrado');
        ws.onerror = (e) => log('WS error', e);
      } catch (err) {
        log('Error conectando WS:', err);
      }
    }

    document.getElementById('register-sw').onclick = registerSW;
    document.getElementById('request-notif').onclick = requestNotificationPermission;
    document.getElementById('subscribe').onclick = subscribePush;
    document.getElementById('simulate').onclick = simulateEvent;
    document.getElementById('connect-ws').onclick = connectWS;

    log('Página lista. Reemplaza BACKEND_URL por la URL pública del backend y pulsa "Suscribirse" para probar.');
  </script>
</body>
</html>
