<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Astra Live — Pruebas</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width:900px; margin:auto; }
    h1 { margin-bottom: 8px; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    button { padding:8px 12px; cursor:pointer; }
    #log { white-space: pre-wrap; background:#f6f8fa; padding:12px; border-radius:8px; margin-top:14px; min-height:140px; font-size:13px; }
    label { display:block; margin-top:10px; }
    input[type=text] { width:100%; padding:8px; box-sizing:border-box; }
    .note { color:#666; font-size:13px; margin-top:6px; }
  </style>
</head>
<body>
  <h1>Astra Live — Página de pruebas</h1>

  <label for="backend">Backend (ej: https://mi-backend.onrender.com)
    <input id="backend" type="text" placeholder="Pega la URL pública de tu backend aquí" />
  </label>
  <div class="note">Asegurate de que el backend exponga /vapidPublicKey, /subscribe y /simulate.</div>

  <div class="controls">
    <button id="register-sw">Registrar SW</button>
    <button id="request-notif">Pedir permiso notifs</button>
    <button id="subscribe">Suscribirse (Push)</button>
    <button id="simulate">Simular evento</button>
    <button id="connect-ws">Conectar WS</button>
    <button id="open-sw-status">Ver estado SW</button>
  </div>

  <h3>Logs / Estado</h3>
  <div id="log">Logs aparecerán aquí...</div>

  <script>
    const logEl = document.getElementById('log');
    const backendInput = document.getElementById('backend');

    function log(...parts) {
      const line = parts.map(p => typeof p === 'object' ? JSON.stringify(p,null,2) : String(p)).join(' ');
      logEl.textContent = new Date().toLocaleTimeString() + ' — ' + line + '\n' + logEl.textContent;
      console.log(line);
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
      return out;
    }

    async function registerSW() {
      if (!('serviceWorker' in navigator)) {
        log('Service Worker no soportado en este navegador.');
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        log('Service Worker registrado en:', reg.scope);
      } catch (err) {
        log('Error registrando SW:', err);
      }
    }

    async function requestNotificationPermission() {
      try {
        const p = await Notification.requestPermission();
        log('Permiso de notificaciones:', p);
      } catch (err) {
        log('Error pidiendo permiso:', err);
      }
    }

    async function subscribePush() {
      const backend = backendInput.value.trim();
      if (!backend) return log('Pon la URL del backend en el campo Backend.');

      try {
        const res = await fetch(new URL('/vapidPublicKey', backend).toString());
        if (!res.ok) throw new Error('GET /vapidPublicKey -> ' + res.status);
        const data = await res.json();
        const vapidKey = data.key || data.publicKey || data;
        if (!vapidKey) throw new Error('vapidPublicKey vacío');

        if (!navigator.serviceWorker.controller) {
          await registerSW();
        }
        const reg = await navigator.serviceWorker.ready;

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidKey)
        });

        log('Suscripción obtenida, enviando a backend...');
        const resp = await fetch(new URL('/subscribe', backend).toString(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });

        if (!resp.ok) {
          const body = await resp.text().catch(()=>'<no body>');
          throw new Error('/subscribe -> ' + resp.status + ' ' + body);
        }
        log('Suscripción enviada correctamente. Status:', resp.status);
      } catch (err) {
        log('Error en subscribePush:', err.message || err);
      }
    }

    async function simulateEvent() {
      const backend = backendInput.value.trim();
      if (!backend) return log('Pon la URL del backend en el campo Backend.');
      try {
        const resp = await fetch(new URL('/simulate', backend).toString(), { method: 'POST' });
        const txt = await resp.text().catch(()=>'<no body>');
        log('/simulate ->', resp.status, txt);
      } catch (err) {
        log('Error simulate:', err);
      }
    }

    function connectWS() {
      const backend = backendInput.value.trim();
      if (!backend) return log('Pon la URL del backend en el campo Backend.');
      try {
        const wsUrl = backend.replace(/^http/, 'ws') + '/ws';
        const ws = new WebSocket(wsUrl);
        ws.onopen = () => log('WS conectado', wsUrl);
        ws.onmessage = e => log('WS mensaje:', e.data);
        ws.onclose = () => log('WS cerrado');
        ws.onerror = e => log('WS error', e);
      } catch (err) {
        log('Error conectando WS:', err);
      }
    }

    async function showSwStatus() {
      if (!('serviceWorker' in navigator)) return log('Service Worker no soportado.');
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return log('No hay Service Worker registrado.');
      log('SW scope:', reg.scope, 'active state:', reg.active ? reg.active.state : 'no active');
    }

    // Attach handlers
    document.getElementById('register-sw').onclick = registerSW;
    document.getElementById('request-notif').onclick = requestNotificationPermission;
    document.getElementById('subscribe').onclick = subscribePush;
    document.getElementById('simulate').onclick = simulateEvent;
    document.getElementById('connect-ws').onclick = connectWS;
    document.getElementById('open-sw-status').onclick = showSwStatus;

    // Helpful note
    log('Página lista. Pega la URL pública del backend y luego: Registrar SW → Pedir permiso → Suscribirse → Simular.');
  </script>
</body>
</html>
